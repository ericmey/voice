# Parakeet / Riva STT — canonical MANAGED deployment.
#
# Parakeet-ctl was an UNMANAGED bare `docker run` (restart=no, no compose/systemd) — it did not
# survive reboot and was itself a launch blocker. This is now its authoritative definition:
#   - pinned to the immutable image DIGEST (no floating :latest);
#   - attached to the external `voice_default` network so the Sumi worker reaches it by service
#     DNS at `parakeet-ctl:50051` (the STT contract);
#   - loopback publishes (127.0.0.1:50051 / :9000) PRESERVED for host-side riva clients + ops;
#   - `restart: unless-stopped` so it survives recreate/reboot.
#
# Reproduces ONLY the real docker-run overrides diffed against the image Config — NIM_MODEL_PROFILE,
# the model-cache bind, the GPU request, shm, and the loopback ports. Entrypoint/cmd, ExposedPorts,
# and the other ~93 env vars are image defaults and are intentionally NOT copied.
name: parakeet
services:
  parakeet-ctl:
    container_name: parakeet-ctl
    image: nvcr.io/nim/nvidia/parakeet-1-1b-ctc-en-us@sha256:5f30bb5fbb6eb2bf4d57bdfa0740c29d787001100f5d185bedc0bbb486376f81
    restart: unless-stopped
    shm_size: "64m"
    environment:
      # the ONE real run-override (selects the served model profile:
      # parakeet-1.1b-en-US-asr-streaming). Everything else is an image default.
      - NIM_MODEL_PROFILE=28d9961db43ac9078bca3f35c97e8ababbcfb9f37c23ec4c2949ccc4831ed958
      # Production starts serve the already-qualified Triton repository. A cold RMIR -> TensorRT
      # build is a provisioning operation, not part of every container start: rebuilding here
      # consumed the launch headroom shared with TTS and then the wrapper exited 0 after Riva's
      # acoustic-model load OOM, producing a misleading restart/rebuild loop.
      - NIM_DISABLE_MODEL_DOWNLOAD=true
      - NIM_WORKSPACE=/opt/nim/empty-workspace
    volumes:
      - /home/ericmey/models/nim-cache:/opt/nim/.cache
      # Durable output of the one-time RMIR -> TensorRT build. Keeping it outside the writable
      # container layer makes restarts/recreates fast and prevents `compose down` from discarding
      # the qualified engine repository.
      - /home/ericmey/models/parakeet-model-repository:/data/models
    ports:
      # loopback-only, preserved verbatim from the bare run. Sumi uses service DNS, not this.
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Parakeet is the legacy benchmark, not a fleet-wide GPU tenant.
              # `count: all` made Triton reserve memory on BOTH 5060 Ti cards. Keep TTS alone on
              # GPU0 (~13.2 GiB) and co-locate Parakeet (~3.6 GiB) with the 16-slot local LLM on
              # GPU1 (~10.7 GiB); neither TTS+STT nor the 24-slot LLM+STT fits safely on 16 GiB.
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - voice_default
    healthcheck:
      # BOTH Riva surfaces must be 200 (ready AND live); curl is present in the image.
      test:
        - "CMD-SHELL"
        - "curl -sf http://127.0.0.1:9000/v1/health/ready && curl -sf http://127.0.0.1:9000/v1/health/live"
      interval: 30s
      timeout: 5s
      retries: 5
      # Engine construction is now a separate provisioning operation: production starts mount
      # the qualified repository and reached ready/live in ~23 seconds. Do not carry the old
      # one-hour build grace into the serving service — it would hide a real launch failure for
      # an hour. Two minutes still gives the measured warm load about 5x headroom.
      start_period: 120s

networks:
  # Owned by the voice Compose project; external so this file joins it without recreating it.
  voice_default:
    external: true
    name: voice_default
