# Shared local Qwen3.5-9B model server. The immutable llama.cpp image and exact
# GGUF hash are qualified together; this service has no external model fallback.
#
# 2026-07-26 — retuned from a single-caller voice config into a CONCURRENCY
# server for the phone-agent POC. Every change below was made against a measured
# result, not a preference; the numbers are in docs/QWEN-POC.md.
#
#   --parallel 2 -> 16     the old value was the concurrency ceiling, and it was
#                          being read as a model limit. Measured on the old
#                          config: decode held flat at 45-48 tok/s from 2 through
#                          8 concurrent while TTFT p50 went 0.23s -> 2.57s. That
#                          is a QUEUE, not saturation. Callers 3..8 were waiting.
#   --ctx-size 16384       ctx is SPLIT across slots (load log: "new slot,
#     -> 262144            n_ctx = 8192" for each of 2). 16384/2 gave 8K per call
#                          against a model that trains to 262144. 262144/16 keeps
#                          16K per call while serving 8x the callers. This was
#                          the qualified 2026-07-26 phone-agent profile and is
#                          retained here as history, not as the live shape.
#
# 2026-07-26, SECOND CUT — 24 slots was qualified and is no longer the placement.
# Parakeet STT (3.64 GB steady) cannot co-reside with TTS (13.26 GB) on GPU0, so
# STT moves to GPU1 alongside this service. 24 x 16384 is 13.31 GB; 13.31 + 3.64
# exceeds the card. 16 x 16384 is 10.68 GB, leaving ~1.9 GB after Parakeet.
#
# At that cut, context per call was kept at 16K rather than slots at 24. The alternative fit
# was 24 x 8192 for the same memory. For a tool-calling phone agent the schema
# plus history is the thing that must not truncate, and 24 simultaneous callers
# is not what this POC has to prove — the L4 does, on 24 GB, without Parakeet.
#
# 2026-07-26, THIRD CUT — Eric deliberately reversed that trade for shared use.
# The server is no longer a phone-agent-owned profile. The live split is:
#
#   8 slots x 32768 context = 262144 total KV tokens
#
# The total KV allocation is unchanged from the qualified 16 x 16384 profile,
# while usable context per request doubles. At the measured 20.56 KiB/token for
# q8_0 K+V with flash attention, this keeps the already-surviving allocation and
# avoids the untested 12 x 24K band. Observed-peak acceptance at 8-way measured
# TTFT p50 0.906s, p95 1.222s, decode 20.14 tok/s, zero restarts, and the same two
# case failures already present in the single-stream baseline.
#
# CONCURRENCY LABELS IN EARLIER VERSIONS OF THIS COMMENT WERE FALSE. The harness
# ran len(cases) x repeat work items through a pool of --concurrency workers, so
# with 12 cases and repeat=1 nothing above 12 was ever in flight. Every "c=16"
# and "c=24" figure previously quoted here was 12-way. Caught by Yua on review.
#
# HISTORICAL 16-SLOT observations, peak_in_flight counted around the request lifetime:
#   16 in flight   21/24 pass   TTFT p50 0.98s  p95 1.36s   decode 12.2 tok/s
#   24 in flight   21/24 pass   TTFT p50 2.24s  p95 5.24s   decode 11.2 tok/s
# These qualify the superseded 16 x 16K profile only. They must not be used as
# capacity claims for the current 8 x 32K split. Current acceptance belongs in
# docs/QWEN-POC.md after an observed-peak rerun.
#
# THE CEILING WAS FOUND BY CROSSING IT: 32 x 16384 loads and reports HEALTHY at
# 15836/16311 MiB, then ABORTS under real concurrent load because ~475 MiB is not
# enough for the compute buffers. restart:unless-stopped recovered it, so the
# watchdog is proven by an actual crash rather than by assertion. NOTE the crash
# happened under 12-WAY client load, not the 16-way originally reported — the
# margin is tighter than the first write-up claimed.
#
# WHICH IS WHY CO-RESIDENCY NEEDS ITS OWN LOAD TEST, not a health check. ~1.9 GB
# of margin is between the 3.0 GB that survived and the 0.5 GB that did not. It
# is untested. "Both containers report healthy" is exactly the reading that was
# wrong at 32 slots.
#
# NOTE the first run after a container start reads ~1.5s at c=8 (cold prompt
# cache) and settles to ~0.54s on reruns. Discard the first sweep after a
# restart; it is warm-up, not the server.
#   --reasoning off        Qwen3.5's template defaults thinking ON. Measured, same
#     (NEW)                cases, only this changed: pass 7/12 -> 10/12, TTFT p50
#                          3.50s -> 0.178s (~20x), decode 26.9 -> 67.7 tok/s.
#                          Five cases spent their ENTIRE token budget thinking and
#                          produced zero audible output. Pinned at the SERVER, not
#                          left to a per-request kwarg: a caller that forgets it
#                          gets 3.5s of dead air, and callers forget.
#   --n-predict 64         a hard 64-token server cap on every reply. Truncation
#     REMOVED              is the caller's decision via max_tokens, not a global.
#   --metrics (NEW)        Prometheus endpoint on the serving port. Zero-cost
#                          observability; no exporter project required.
#   --no-context-shift     without it, an over-long call silently discards the
#     (NEW)                START of its own context and presents as the agent
#                          "forgetting" the caller. Fail loudly instead.
name: sumi-local-llm
services:
  sumi-local-llm:
    container_name: sumi-local-llm
    image: ghcr.io/ggml-org/llama.cpp@sha256:f92150249e1913ef96e744b5d78f6291f0e4399a7925ffc7b1d0680d82506551
    restart: unless-stopped
    command:
      - --model
      # QUALIFIED. Base Qwen3.5-9B on the current 8 x 32K profile: 10/12 pass at
      # an OBSERVED 8 in flight, TTFT p95 1.222s, decode 20.14 tok/s. The two
      # failures were already present in the single-stream baseline.
      - /models/base/Qwen3.5-9B-Q4_K_M.gguf
      #
      # EVALUATED AND REJECTED 2026-07-26 — kept mounted, do not promote:
      #   /models/abliterated/Huihui-Qwen3.5-9B-abliterated.Q4_K_M.gguf
      #   sha256 ea1858ef4dc4b648b8dbb44612962a0333e945060dd0545ac0f28d7c4416e4b3
      # Same config, same cases: 9/12 vs base 12/12, at identical speed
      # (22.39 vs 22.46 tok/s). Three regressions, one of them disqualifying:
      # given "NEVER invent an order number, ask for it, do not call any tool",
      # it emitted lookup_order{"order_number":"12345"} — it FABRICATED a
      # state-changing identifier and called the tool. That is the bad_args
      # class: silent, and read as success by every layer above the model.
      # Equal speed does not buy back invented input. See docs/QWEN-POC.md.
      - --alias
      - sumi-local
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "262144"
      - --parallel
      - "8"
      - --reasoning
      - "off"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --jinja
      - --metrics
      - --no-context-shift
      - --no-ui
    volumes:
      # Both model directories are mounted at SIBLING paths so a rollback is a
      # one-line command change, not a redeploy. They must not nest: mounting
      # one read-only mount inside another fails at container init, because runc
      # cannot mkdir the mountpoint on a read-only rootfs layer.
      - /srv/models/llm/qwen3.5-9b:/models/base:ro
      - /srv/models/llm/qwen3.5-9b-abliterated:/models/abliterated:ro
    ports:
      - 127.0.0.1:8088:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - voice_default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s

networks:
  voice_default:
    external: true
    name: voice_default
