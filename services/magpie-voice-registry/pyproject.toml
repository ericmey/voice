[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magpie-voice-registry"
version = "0.1.0"
description = "Named, checksum-locked voice registry for NVIDIA Magpie Zero Shot TTS"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
